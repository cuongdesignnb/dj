<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Fonts used when an SVG logo is drawn to PNG for emails (server/services/mail/brand.ts).
  Alpine ships no family aliases, so without this every font falls back to a monospace one.
  Oswald (brand headings) maps to the condensed Liberation Sans Narrow.
-->
<fontconfig>
  <alias binding="same"><family>Oswald</family><prefer><family>Liberation Sans Narrow</family><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Inter</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Arial</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="same"><family>Helvetica</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Liberation Mono</family></prefer></alias>
</fontconfig>
