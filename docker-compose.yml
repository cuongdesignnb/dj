services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: destiny-app
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-43171}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - destiny_media:/app/storage/media
    networks:
      - destiny_network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health || curl -fsS http://127.0.0.1:3000/ > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  postgres:
    image: postgres:16-alpine
    container_name: destiny-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-destiny_db}
      POSTGRES_USER: ${POSTGRES_USER:-destiny_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - destiny_postgres_data:/var/lib/postgresql/data
    networks:
      - destiny_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-destiny_user} -d ${POSTGRES_DB:-destiny_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: destiny-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - destiny_redis_data:/data
    networks:
      - destiny_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  destiny_network:
    name: destiny_network
    driver: bridge

volumes:
  destiny_postgres_data:
    name: destiny_postgres_data
  destiny_redis_data:
    name: destiny_redis_data
  destiny_media:
    name: destiny_media

