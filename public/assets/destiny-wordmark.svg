<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
      <defs>
        <filter id="brush-glow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="10" result="blur1" />
          <feGaussianBlur stdDeviation="20" result="blur2" />
          <feMerge>
            <feMergeNode in="blur2" />
            <feMergeNode in="blur1" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>
      <!-- Thick red glow outline -->
      <text x="400" y="140" font-family="'Oswald', sans-serif" font-size="150" font-weight="900" font-style="italic" fill="#FFFFFF" stroke="#FF173D" stroke-width="6" filter="url(#brush-glow)" text-anchor="middle" letter-spacing="2">DESTINY</text>
    </svg>