<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
      <defs>
        <filter id="glow-con" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="3" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
      </defs>
      <!-- Circular C -->
      <circle cx="40" cy="40" r="28" fill="none" stroke="#FF173D" stroke-width="2.5" filter="url(#glow-con)" />
      <circle cx="40" cy="40" r="23" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.2" />
      <text x="40" y="49" font-family="'Oswald', sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="middle">C</text>
      
      <!-- Connection text -->
      <text x="85" y="42" font-family="'Oswald', sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF" letter-spacing="1">CONNECTION</text>
      <text x="85" y="56" font-family="'Inter', sans-serif" font-size="8" font-weight="bold" fill="#A6A6B2" letter-spacing="2">SOUND MEETS SOUL</text>
    </svg>